name: Render README cards

on:
  schedule:
    - cron: "23 6 * * *" # daily, 06:23 UTC (off the hour to dodge the scheduler rush)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render_readme_cards.py"
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: pip install "fonttools>=4.50,<5"

      - name: Render README cards (hero, graph, activity, tiles, repos, stack)
        env:
          # Optional README_PAT (fine-grained, read-only user access) adds private contributions.
          # Without it the default token still sees everything public.
          GH_TOKEN: ${{ secrets.README_PAT || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/render_readme_cards.py

      - name: Commit changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards fonts data README.md
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git commit -m "chore: redraw README cards"
          git push
